<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>接驳 · iPhone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fafafa;
    --sidebar: #e8e8ea;
    --panel: #ffffff;
    --ink: #171717;
    --muted: #6e6e6e;
    --line: #e0e0e4;
    --user: #f0f0f2;
    --mist: #f0f0f2;
    --brass: #c4a36a;
    --ok: #16a34a;
    --danger: #dc2626;
    --shadow: 0 10px 28px rgba(23, 23, 23, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ececee; color: var(--ink); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .page { max-width: 1280px; margin: 0 auto; padding: 40px 28px 80px; }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin: 0 0 8px; }
  header .lede { max-width: 46em; color: var(--muted); margin: 0 0 20px; }
  .decisions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
  .decisions span {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
  }
  .flow {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 36px;
    letter-spacing: 0.01em;
  }
  .flow b { color: var(--ink); font-weight: 600; }
  h2 { font-size: 15px; font-weight: 600; margin: 36px 0 14px; }
    .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 28px 18px;
    justify-items: center;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .frame { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .frame figcaption { font-size: 12px; color: var(--muted); text-align: center; }
  .frame figcaption strong { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }

  .phone {
    width: 300px;
    height: 640px;
    background: var(--paper);
    border-radius: 36px;
    border: 7px solid #1a1a1c;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .phone svg { width: 15px; height: 15px; flex: none; display: block; }
  .phone .mark { width: 26px; height: 26px; }
  .status {
    height: 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 16px 4px;
    font-size: 11px;
    font-weight: 600;
    flex: none;
  }
  .island {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 78px;
    height: 18px;
    background: #1a1a1c;
    border-radius: 20px;
  }
  .glyphs { display: flex; gap: 4px; align-items: center; }
  .home {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 96px;
    height: 4px;
    border-radius: 4px;
    background: #1a1a1c;
    z-index: 5;
  }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  .mark { width: 22px; height: 22px; flex: none; }
  .nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 12px 8px;
    flex: none;
  }
  .nav .titles { min-width: 0; flex: 1; }
  .nav .name { font-size: 15px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav .sub { font-size: 11px; color: var(--muted); }
  .iconbtn {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--mist); display: grid; place-items: center; flex: none; color: var(--ink);
  }
  .iconbtn svg, .row svg, .toolrow svg { width: 15px; height: 15px; }
  .back { font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 2px; flex: none; }
  .back svg { width: 14px; height: 14px; }

  .list { padding: 0 10px; overflow: hidden; }
  .chat {
    display: flex; flex-direction: column; gap: 2px;
    padding: 10px 10px; border-radius: 12px;
  }
  .chat .t { font-size: 14px; font-weight: 600; }
  .chat .s { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .newrow {
    margin: 4px 12px 6px;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .brand {
    display: flex; gap: 8px; align-items: center;
    padding: 0 14px 8px;
  }
  .brand .name { font-size: 16px; font-weight: 600; line-height: 1.1; }
  .brand .sub { font-size: 11px; color: var(--muted); }

  .thread { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px 8px; }
  .user {
    margin-left: 48px;
    background: var(--user);
    border-radius: 14px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.45;
  }
  .agent { font-size: 12px; line-height: 1.5; margin-top: 10px; }
  .agent p { margin: 0 0 8px; }
  .agent h3 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10.5px;
    background: var(--user);
    border-radius: 8px;
    padding: 6px 8px;
    color: var(--ink);
  }
  .files-label { font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
  .fileline {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 5px 0;
  }
  .fileline svg { width: 13px; height: 13px; color: var(--muted); }

  .loopbar {
    margin: 0 12px 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px;
  }
  .loopbar .grow { flex: 1; min-width: 0; }
  .loopbar em { font-style: normal; color: var(--muted); }

  .composer-wrap { padding: 0 10px 18px; flex: none; }
  .composer {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 8px 18px rgba(23,23,23,0.05);
    padding: 8px 8px 6px;
  }
  .ph { font-size: 13px; color: #a3a3a3; padding: 2px 4px 6px; min-height: 22px; }
  .ph.on { color: var(--ink); }
  .chips { display: flex; align-items: center; gap: 4px; }
  .chip {
    height: 24px; padding: 0 7px; border-radius: 8px;
    background: var(--mist); font-size: 10px; display: flex; align-items: center; gap: 2px;
    white-space: nowrap;
  }
  .chip.on { background: var(--ink); color: var(--paper); }
  .send {
    margin-left: auto;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
  }
  .send svg { width: 12px; height: 12px; }
  .plus {
    width: 24px; height: 24px; border-radius: 50%; background: var(--mist);
    display: grid; place-items: center;
  }
  .plus svg { width: 12px; height: 12px; }

  .kb {
    height: 196px; background: #d1d5db; padding: 6px 4px 16px; flex: none;
  }
  .kb row, .krow { display: flex; gap: 3px; margin-bottom: 4px; justify-content: center; }
  .key {
    background: #fff; border-radius: 5px; height: 32px; flex: 1;
    display: grid; place-items: center; font-size: 12px; box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .key.wide { flex: 1.4; background: #adb3bd; font-size: 10px; }
  .key.space { flex: 5; font-size: 11px; }

  .sheet-scrim {
    position: absolute; inset: 0; background: rgba(23,23,23,0.28); z-index: 2;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    padding: 8px 0 22px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.08);
  }
  .sheet.tall { top: 118px; }
  .grab {
    width: 32px; height: 4px; border-radius: 4px; background: var(--line);
    margin: 2px auto 8px;
  }
  .toolrow {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; font-size: 14px;
  }
  .toolrow .m { margin-left: auto; color: var(--muted); font-size: 12px; }
  .grouplab { font-size: 11px; color: var(--muted); padding: 8px 16px 2px; }

  .tree { background: var(--sidebar); flex: 1; min-height: 0; padding: 4px 8px 20px; }
  .crumb { font-size: 11px; color: var(--muted); padding: 0 8px 6px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 13px; border-radius: 8px; }
  .node.indent { padding-left: 26px; }
  .node svg { width: 14px; height: 14px; color: var(--muted); }
  .dimtree { filter: brightness(0.72); }

  .preview-card { padding: 0 12px 16px; }
  .slide {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    height: 168px;
    padding: 16px;
  }
  .slide .k { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); }
  .slide h4 { margin: 8px 0; font-size: 18px; font-weight: 600; }
  .slide p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.45; }
  .sheethead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px 8px; font-size: 13px; font-weight: 600;
  }
  .x { width: 22px; height: 22px; border-radius: 50%; background: var(--mist); display: grid; place-items: center; font-size: 12px; }

  .diff {
    margin: 0 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); font-family: ui-monospace, Menlo, monospace; font-size: 10px; line-height: 1.45;
  }
  .diff .h { background: var(--sidebar); padding: 4px 8px; color: var(--muted); }
  .diff .add { background: #e8f5ec; padding: 1px 8px; }
  .diff .del { background: #fdecec; padding: 1px 8px; }
  .gitrow {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; font-size: 13px;
  }
  .badge { margin-left: auto; font-size: 11px; color: var(--brass); }

  .field {
    margin: 0 12px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
  }
  .field .l { font-size: 11px; color: var(--muted); }
  .field .v { font-size: 13px; margin-top: 2px; }
  .stop {
    margin: 8px 12px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--paper);
    display: grid; place-items: center; font-size: 13px;
  }
  .drawer-scrim { position: absolute; inset: 0; background: rgba(23,23,23,0.28); z-index: 2; }
  .drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: 78%;
    background: var(--sidebar); z-index: 3;
    display: flex; flex-direction: column; padding: 44px 0 16px;
  }
  .drawer .who { display: flex; gap: 8px; align-items: center; padding: 0 14px 12px; }
  .drawer .who .name { font-size: 15px; font-weight: 600; line-height: 1.1; }
  .drawer .who .sub { font-size: 11px; color: var(--muted); }
  .drow { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; }
  .drow.on { background: var(--ink); color: var(--paper); margin: 0 8px; border-radius: 10px; }
  .drow .m { margin-left: auto; color: var(--muted); font-size: 11px; }
  .drow.on .m { color: rgba(250,250,250,0.7); }
  .dlab { font-size: 11px; color: var(--muted); padding: 10px 14px 2px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>接驳 · iPhone</h1>
    <p class="lede">打开就是当前这条对话。抽屉顶上是正在用的工作区，点进去才是工作区列表。文件、搜索、Git、终端、Loop 跟会话放在一起。主题不在这一层，只出现在工作区列表的最底下。</p>
    <div class="decisions">
      <span>打开即对话</span>
      <span>工作区列表在抽屉顶</span>
      <span>主题再低一层</span>
      <span>五个工具留在抽屉</span>
      <span>预览仍是第二层</span>
    </div>
    <p class="flow">打开 App <b>落在对话</b> · 点菜单 <b>拉出抽屉</b> · 点工作区名 <b>进入列表</b> · 点文件、Git、Loop <b>盖住全屏</b></p>
  </header>

  <h2>八帧</h2>
  <div class="grid" id="board"></div>
</div>

<template id="chrome">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="glyphs">●● LTE</span></div>
</template>

<script>
const mark = `<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#171717"/><rect x="6" y="6" width="13" height="15" rx="3.2" fill="#FAFAFA"/><rect x="13" y="11" width="13" height="15" rx="3.2" fill="#C4A36A"/><circle cx="16" cy="16" r="1.85" fill="#171717"/></svg>`;
const ico = {
  menu: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
  chev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>`,
  chevR: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`,
  folder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3z"/></svg>`,
  ellipsis: `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V6M6 12l6-6 6 6"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>`,
  git: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6 8v8M8 6h6a4 4 0 010 8h-2"/></svg>`,
  term: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>`,
  loop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a7 7 0 0112-4l2-2v5h-5"/><path d="M20 12a7 7 0 01-12 4l-2 2v-5h5"/></svg>`,
  stack: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>`,
  palette: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 100 18h1.5a2 2 0 000-4H12a2 2 0 01-2-2 5 5 0 015-5z"/><circle cx="8" cy="10" r="1" fill="currentColor"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>`,
  doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>`,
  img: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg>`,
  chevd: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`,
};

function phone(inner) {
  return `<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span class="glyphs">LTE</span></div><div class="body">${inner}</div><div class="home"></div></div>`;
}

const composer = (text, on) => `
  <div class="composer-wrap"><div class="composer">
    <div class="ph ${on ? "on" : ""}">${text}</div>
    <div class="chips">
      <span class="plus">${ico.plus}</span>
      <span class="chip on">代理</span>
      <span class="chip">Composer 2.5</span>
      <span class="chip">${ico.ellipsis}</span>
      <span class="send">${ico.up}</span>
    </div>
  </div></div>`;

const threadBody = `
  <div class="nav">
    <span class="iconbtn">${ico.menu}</span>
    <div class="titles" style="text-align:center">
      <div class="name">载人航天</div>
      <div class="sub">acrabat · 代理</div>
    </div>
    <span class="iconbtn">${ico.plus}</span>
  </div>
  <div class="loopbar"><span class="dot"></span><span class="grow">正在整理讲稿 <em>· Loop 第 2 拍</em></span></div>
  <div class="thread">
    <div class="user">把讲稿收成三页幻灯片，第 2 页和口播对齐。</div>
    <div class="agent">
      <p>三页都已渲染。PDF 重新生成过，讲稿和 Canvas 同步了。</p>
      <h3>输出文件</h3>
      <div class="code">slides.html · slide-1.png … slide-3.png</div>
      <div class="files-label">相关文件</div>
      <div class="fileline">${ico.doc} slides.html</div>
      <div class="fileline">${ico.img} slide-1.png</div>
      <div class="fileline">${ico.doc} speech-script.md</div>
    </div>
  </div>`;

const fileTree = `
  <div class="nav">
    <span class="back">${ico.chev} 对话</span>
    <div class="titles" style="text-align:center"><div class="name">文件</div><div class="sub">acrabat</div></div>
    <span class="iconbtn">${ico.search}</span>
  </div>
  <div class="tree">
    <div class="crumb">工作区</div>
    <div class="node">${ico.chevd} docs</div>
    <div class="node indent">${ico.doc} slides.html</div>
    <div class="node indent">${ico.img} slide-1.png</div>
    <div class="node indent">${ico.img} slide-2.png</div>
    <div class="node indent">${ico.img} slide-3.png</div>
    <div class="node indent">${ico.doc} speech-script.md</div>
    <div class="node">${ico.chevd} ios</div>
  </div>`;

const drawer = `
  <div class="drawer">
    <div class="who">${mark}<div style="flex:1"><div class="name">acrabat</div><div class="sub">工作区</div></div><span class="iconbtn">${ico.chevR}</span></div>
    <div class="drow">${ico.plus} 新对话</div>
    <div class="drow on"><span class="dot" style="background:#8fbfb0"></span> 载人航天 <span class="m">刚刚</span></div>
    <div class="drow">继续 <span class="m">昨天</span></div>
    <div class="drow">接驳 IDE <span class="m">周一</span></div>
    <div class="dlab">这个工作区</div>
    <div class="drow">${ico.folder} 文件</div>
    <div class="drow">${ico.search} 搜索</div>
    <div class="drow">${ico.git} Git</div>
    <div class="drow">${ico.term} 终端</div>
    <div class="drow">${ico.loop} Loop <span class="m"><span class="dot"></span></span></div>
  </div>`;

const frames = [
  {
    title: "1  入口",
    cap: "打开就是这条对话。左边菜单，右边新对话。状态条写它正在做什么。",
    html: phone(threadBody + composer("跟远端说…", false))
  },
  {
    title: "2  抽屉",
    cap: "顶上是当前工作区，点它进入列表。下面是会话和五个工具。主题不在这里。",
    html: phone(`
      <div style="position:absolute;inset:0;display:flex;flex-direction:column">${threadBody}${composer("跟远端说…", false)}</div>
      <div class="drawer-scrim"></div>
      ${drawer}
    `)
  },
  {
    title: "3  工作区",
    cap: "从抽屉顶进入。点一行切过去，并打开那个工作区最近的一条。主题只在最底，字是次要色。",
    html: phone(`
      <div class="nav">
        <span class="back">${ico.chev} 对话</span>
        <div class="titles" style="text-align:center"><div class="name">工作区</div></div>
        <span style="width:28px"></span>
      </div>
      <div class="gitrow">${mark} acrabat <span class="badge" style="color:#171717">正在用</span></div>
      <div class="gitrow" style="color:#6e6e6e">${ico.folder} notes</div>
      <div class="gitrow" style="color:#6e6e6e">${ico.folder} cursor-remote</div>
      <div style="flex:1"></div>

    `)
  },
  {
    title: "5  文件",

  {

      </div>
    `)
  },
  {
    title: "7  Git",
    cap: "从抽屉进入。点一行是上下 diff。",
    html: phone(`
      <div class="nav">
        <span class="back">${ico.chev} 对话</span>
