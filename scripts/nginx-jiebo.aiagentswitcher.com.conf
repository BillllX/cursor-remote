server {
    listen 80;
    listen [::]:80;
    server_name jiebo.aiagentswitcher.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiebo.aiagentswitcher.com;

    ssl_certificate /etc/letsencrypt/live/jiebo.aiagentswitcher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiebo.aiagentswitcher.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    access_log /var/log/nginx/jiebo.timing.log timing;
    client_max_body_size 36m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /bridge {
        proxy_pass http://cursor_gateway/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    location ^~ /upload {
        client_max_body_size 36m;
        access_log /var/log/nginx/jiebo.upload.log combined;
        proxy_pass http://cursor_gateway/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 120;
        proxy_redirect off;
    }

    location ^~ /media {
        proxy_pass http://cursor_gateway/media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Upgrade;
        proxy_read_timeout 120;
        proxy_redirect off;
        access_log off;
    }

    # stored_state 的 HTTP 拉取通道（iOS 单条 WS 消息约 1MiB 上限时的兜底）
    location ^~ /state {
        proxy_pass http://cursor_gateway/state;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120;
        proxy_redirect off;
        access_log off;
    }

    # 租户对外预览：https://jiebo.aiagentswitcher.com/p/<id>/
    location ^~ /p/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://cursor_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }
}
