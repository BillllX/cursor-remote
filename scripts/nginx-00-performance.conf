gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream cursor_web {
    server 127.0.0.1:3020;
    keepalive 32;
}

upstream cursor_gateway {
    server 127.0.0.1:8787;
    keepalive 8;
}

log_format timing '$remote_addr $request_time $upstream_response_time '
                  '$status $body_bytes_sent $request';
